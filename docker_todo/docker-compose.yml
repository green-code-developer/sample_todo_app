services:
  postgres:
    build:
      context: ./postgres
    ports:
      - 61121:5432
    environment:
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - POSTGRES_DB=todo
    healthcheck:
      test: pg_isready -Utodo
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:

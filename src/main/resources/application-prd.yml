# 本番環境用設定
# ローカル環境と異なる点のみ記載する
server:
  # nginx が付ける X-Forwarded-Proto / X-Forwarded-Host を使う。
  # 付けないと、リダイレクト先が http:// になる(nginx からは平文の HTTP で届くため)
  # native ではなく framework にする。native は接続元が内部のアドレスのときだけヘッダーを信用するが、
  # rootless Podman 越しだと接続元がサーバーの外向きのアドレスに見えることがある
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # HTTPS 環境限定のセキュリティ対策
        # cookie を堅牢にする
        secure: true
        name: __Host-SESSION

spring:
  datasource:
    url: jdbc:postgresql://host.docker.internal:61101/todo?currentSchema=TODO
  # ローカル設定戻し　ここから
  thymeleaf:
    cache: true
    prefix: classpath:/templates/
  web:
    resources:
      static-locations: classpath:/static/
  # ローカル設定戻し　ここまで

app:
  name: やること
